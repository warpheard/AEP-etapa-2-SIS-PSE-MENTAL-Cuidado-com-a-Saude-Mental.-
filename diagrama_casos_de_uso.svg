<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- Fronteira do sistema -->
  <rect x="210" y="20" width="770" height="620" rx="6" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="595" y="48" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">SIS-PSE MENTAL — Programa Saúde na Escola</text>

  <!-- Ator -->
  <g stroke="#222" stroke-width="2.5" fill="none">
    <circle cx="90" cy="270" r="17"/>
    <line x1="90" y1="287" x2="90" y2="345"/>
    <line x1="55" y1="308" x2="125" y2="308"/>
    <line x1="90" y1="345" x2="60" y2="392"/>
    <line x1="90" y1="345" x2="120" y2="392"/>
  </g>
  <text x="90" y="418" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Usuário</text>
  <text x="90" y="437" text-anchor="middle" font-size="12" fill="#444">(profissional do PSE)</text>

  <!-- Associações ator -> casos de uso -->
  <g stroke="#444" stroke-width="1.5" fill="none">
    <line x1="125" y1="308" x2="300" y2="100"/>
    <line x1="125" y1="308" x2="300" y2="185"/>
    <line x1="125" y1="308" x2="300" y2="272"/>
    <line x1="125" y1="308" x2="300" y2="358"/>
    <line x1="125" y1="308" x2="300" y2="445"/>
    <line x1="125" y1="308" x2="300" y2="530"/>
  </g>

  <!-- Casos de uso implementados (linha contínua) -->
  <g fill="#e8f1fb" stroke="#2f6db5" stroke-width="2">
    <ellipse cx="430" cy="100" rx="135" ry="36"/>
    <ellipse cx="430" cy="185" rx="135" ry="36"/>
  </g>
  <!-- Casos de uso propostos (linha tracejada) -->
  <g fill="#f4f8fd" stroke="#2f6db5" stroke-width="2" stroke-dasharray="7 4">
    <ellipse cx="430" cy="272" rx="135" ry="36"/>
    <ellipse cx="430" cy="358" rx="135" ry="36"/>
    <ellipse cx="430" cy="445" rx="135" ry="36"/>
    <ellipse cx="430" cy="530" rx="135" ry="36"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#14304f">
    <text x="430" y="105">UC01 Cadastrar estudante</text>
    <text x="430" y="190">UC02 Listar estudantes</text>
    <text x="430" y="277">UC03 Buscar estudante por ID</text>
    <text x="430" y="363">UC04 Alterar dados do estudante</text>
    <text x="430" y="450">UC05 Remover estudante</text>
    <text x="430" y="535">UC06 Gerar resumo por turma</text>
  </g>

  <!-- Casos de uso incluídos -->
  <g fill="#fdf3e1" stroke="#c07a12" stroke-width="2">
    <ellipse cx="820" cy="100" rx="140" ry="42"/>
  </g>
  <g fill="#fdf3e1" stroke="#c07a12" stroke-width="2" stroke-dasharray="7 4">
    <ellipse cx="820" cy="400" rx="140" ry="42"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#4a2f05">
    <text x="820" y="95">Verificar limite</text>
    <text x="820" y="114">de cadastros (50)</text>
    <text x="820" y="395">Localizar estudante</text>
    <text x="820" y="414">(valida existência)</text>
  </g>

  <!-- «include» -->
  <g stroke="#444" stroke-width="1.5" stroke-dasharray="7 5" fill="none" marker-end="url(#open)">
    <line x1="565" y1="100" x2="678" y2="100"/>
    <line x1="545" y1="376" x2="695" y2="382"/>
    <line x1="545" y1="427" x2="695" y2="418"/>
  </g>
  <g font-size="12" font-style="italic" fill="#333" text-anchor="middle">
    <text x="621" y="90">«include»</text>
    <text x="620" y="366">«include»</text>
    <text x="620" y="446">«include»</text>
  </g>

  <!-- Legenda -->
  <g>
    <ellipse cx="260" cy="612" rx="20" ry="11" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
    <text x="290" y="617" font-size="13" fill="#222">Implementado no código atual (opções 1 e 2 do menu)</text>
    <ellipse cx="640" cy="612" rx="20" ry="11" fill="#f4f8fd" stroke="#2f6db5" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="670" y="617" font-size="13" fill="#222">Proposto para a 2ª etapa</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
